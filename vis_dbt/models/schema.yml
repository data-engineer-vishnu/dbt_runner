
version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    config:
      tags: ["docker_test"]
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_third_dbt_model
    description: "Adds the execution_date CLI var as a column alongside my_second_dbt_model's data"
    columns:
      - name: id
        description: "The primary key for this table"
      - name: execution_date
        description: "The execution_date passed via --vars, or the run's start date if not supplied"
        data_tests:
          - not_null

  - name: customer_as_string
    description: "customer with every column cast to STRING (macros/cast_columns_to_string.sql). Masks are inherited from customer."

  - name: churners_quoted
    description: "churners with every value wrapped in double quotes (macros/quote_column_values.sql)."

  - name: bank_churners_quoted
    description: "bank_churners with STRING columns wrapped in double quotes; other columns unchanged (macros/quote_string_columns.sql)."
