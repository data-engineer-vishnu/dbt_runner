
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'vis_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'vis_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# BigQuery dynamic column masking (macros/masking.sql).
# mask_data_policies maps the `mask_policy` names used in model YAML
# (columns[].config.meta.mask_policy) to direct v2 data-policy IDs created by
# terraform/masking.tf (`terraform output dbt_masking_vars`). Bare IDs are
# resolved against target.project / target.location, so the same values work in
# every environment; a full "<project>.region-<location>.<id>" also works.
vars:
  masking_enabled: true             # set false (--vars) to skip attaching policies
  mask_inherit_from_parents: true   # re-apply upstream masks to same-named downstream columns
  mask_data_policies:
    asterisk: mask_asterisk_v2
    hash: mask_hash_v2
    sha256: mask_sha256_v2
    email: mask_email_v2
    last_four: mask_last_four_v2
    nullify: mask_nullify_v2
    default: mask_default_v2
    year_only: mask_year_only_v2
  raw_data_policy: raw_pii_v2

models:
  vis_dbt:
    # Attaches BigQuery data policies to columns marked with mask_policy in YAML
    # (and to columns inheriting a mask from an upstream model).
    +post-hook: "{{ apply_column_masks() }}"

seeds:
  vis_dbt:
    +post-hook: "{{ apply_column_masks() }}"

# Add the same post-hook under `snapshots:` once the project has snapshots.
